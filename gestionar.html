<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantel Valle de Bravo</title>
    <link rel="stylesheet" href="principal.css">
    <link rel="icon" href="img/unnamed-removebg-preview.png" type="png">

    <style>
        /* --- TUS ESTILOS ORIGINALES --- */
        .fondo-valle{
            background-image: linear-gradient(to top, #0593bb 20%, #0e26ae 80%);
            background-size: cover;
            background-position: center center;
            width: 100%;
            height: 80vh;
            background-attachment: fixed;
        }

        /* --- CENTRADO GENERAL --- */
        section {
            text-align: center;
        }

        h2 {
            font-size: 28px;
            color: #00c4cc;
            font-weight: bold;
            margin-bottom: 25px;
        }

        /* --- CARRUSEL ARREGLADO Y CENTRADO --- */
        .content-all {
            width: 100%;
            display: flex;
            justify-content: center; /* CENTRA */
            align-items: center;      /* CENTRA */
            margin-top: 30px;
        }

        .content-carrousel {
            width: 280px;          /* tamaño perfecto para celular */
            height: 350px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotar 18s infinite linear;
        }

        .content-carrousel figure {
            width: 100%;
            height: 100%;
            position: absolute;
            overflow: hidden;
            border-radius: 20px;
        }

        .content-carrousel img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* evita deformación */
        }

        /* --- POSICIONES DE TUS 8 IMÁGENES --- */
        .content-carrousel figure:nth-child(1){ transform: rotateY(0deg) translateZ(350px); }
        .content-carrousel figure:nth-child(2){ transform: rotateY(45deg) translateZ(350px); }
        .content-carrousel figure:nth-child(3){ transform: rotateY(90deg) translateZ(350px); }
        .content-carrousel figure:nth-child(4){ transform: rotateY(135deg) translateZ(350px); }
        .content-carrousel figure:nth-child(5){ transform: rotateY(180deg) translateZ(350px); }
        .content-carrousel figure:nth-child(6){ transform: rotateY(225deg) translateZ(350px); }
        .content-carrousel figure:nth-child(7){ transform: rotateY(270deg) translateZ(350px); }
        .content-carrousel figure:nth-child(8){ transform: rotateY(315deg) translateZ(350px); }

        @keyframes rotar {
            from { transform: rotateY(0deg); }
            to   { transform: rotateY(360deg); }
        }

    </style>
</head>

<body>

    <div class="header">
        <div class="inner-header flex">
            <h1>
                <img src="cd3.png" style="width: 900px;"><br>
                <img src="cl2.png" style="width: 600px;">
            </h1>
        </div>

        <div>
            <svg class="agua" xmlns="http://www.w3.org/2000/svg"
                viewBox="0 24 150 28" preserveAspectRatio="none">
                <defs>
                    <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s58 18 88 18
                    58-18 88-18 58 18 88 18v44h-352z" />
                </defs>
                <g class="parallax">
                    <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.7)" />
                    <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.5)" />
                    <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.3)" />
                    <use xlink:href="#gentle-wave" x="48" y="7" fill="#fff" />
                </g>
            </svg>
        </div>
    </div>

    <!-- ------------ GALERÍA ARREGLADA ---------------- -->
    <section>
        <h2>TU IDENTIDAD, TUS DOCUMENTOS</h2>

        <div class="content-all">
            <div class="content-carrousel">
                <figure><img src="acta.jpg"></figure>
                <figure><img src="curp.jpg"></figure>
                <figure><img src="ine.jpg"></figure>
                <figure><img src="mex.jpeg"></figure>
                <figure><img src="lic.jpg"></figure>
                <figure><img src="vis.jpg"></figure>
                <figure><img src="acta.jpg"></figure>
                <figure><img src="curp.jpg"></figure>
            </div>
        </div>
    </section>

    <div class="separador"></div>

</body>
</html>
