<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantel Valle de Bravo</title>

    <!-- Ícono -->
    <link rel="icon" href="img/unnamed-removebg-preview.png" type="image/png">

    <!-- Tu CSS -->
    <link rel="stylesheet" href="principal.css">

    <!-- LIGHTBOX CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet">

    <!-- LIGHTBOX JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>

    <style>
        /* Fondo degradado */
        .fondo-valle {
            background-image: linear-gradient(to top, #0593bb 20%, #0e26ae 80%);
            background-size: cover;
            background-position: center center;
            width: 100%;
            height: 80vh;
            background-attachment: fixed;
        }

        .contenido-fondo-valle {
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Animación de olas */
        @keyframes move_wave {
            0% { transform: translateX(0) scaleY(1); }
            50% { transform: translateX(-25%) scaleY(0.55); }
            100% { transform: translateX(-50%) scaleY(1); }
        }
    </style>

</head>
<body>

    <!-- Título -->
    <img src="TITU.png" alt="Título">

    <section class="gal"><br>

        <main id="galeria" class="galeria">

            <!-- Cada imagen dentro de la galería -->
            <div class="galeria_item">
                <a href="actana1.png" data-lightbox="models" data-title="Imagen 1">
                    <img src="actana1.png" alt="">
                </a>
            </div>

            <div class="galeria_item">
                <a href="tr.jpg" data-lightbox="models" data-title="Imagen 2">
                    <img src="tr.jpg" alt="">
                </a>
            </div>

            <div class="galeria_item">
                <a href="ine2.jpg" data-lightbox="models" data-title="Imagen 3">
                    <img src="ine2.jpg" alt="">
                </a>
            </div>

            <div class="galeria_item">
                <a href="sol.jpg" data-lightbox="models" data-title="Imagen 4">
                    <img src="sol.jpg" alt="">
                </a>
            </div>

            <div class="galeria_item">
                <a href="pas.jpg" data-lightbox="models" data-title="Imagen 5">
                    <img src="pas.jpg" alt="">
                </a>
            </div>

            <div class="galeria_item">
                <a href="con2.jpg" data-lightbox="models" data-title="Imagen 6">
                    <img src="con2.jpg" alt="">
                </a>
            </div>

            <div class="galeria_item">
                <a href="reg2.jpg.png" data-lightbox="models" data-title="Imagen 7">
                    <img src="reg2.jpg.png" alt="">
                </a>
            </div>

            <div class="galeria_item">
                <a href="inss.jpg" data-lightbox="models" data-title="Imagen 8">
                    <img src="inss.jpg" alt="">
                </a>
            </div>

            <div class="galeria_item">
                <a href="SAT.jpg" data-lightbox="models" data-title="Imagen 9">
                    <img src="SAT.jpg" alt="">
                </a>
            </div>

            <div class="galeria_item">
                <a href="cons.jpg" data-lightbox="models" data-title="Imagen 10">
                    <img src="cons.jpg" alt="">
                </a>
            </div>

        </main>

    </section>

</body>
</html>
